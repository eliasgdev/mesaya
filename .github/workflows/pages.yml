name: Publicar web en GitHub Pages

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx ng build --base-href /mesaya/
      # GitHub Pages no conoce las rutas de Angular: 404.html sirve la app en cualquier ruta
      - run: cp dist/mesaya-frontend/browser/index.html dist/mesaya-frontend/browser/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist/mesaya-frontend/browser
      - id: despliegue
        uses: actions/deploy-pages@v4
