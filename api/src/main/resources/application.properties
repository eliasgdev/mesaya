spring.application.name=mesaya
server.port=${PORT:9000}

# Base de datos: SQLite por defecto (archivo local). Con el perfil "postgres" se usa PostgreSQL.
spring.datasource.url=${DB_URL:jdbc:sqlite:mesaya.db?foreign_keys=true}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite admite un solo escritor a la vez
spring.datasource.hikari.maximum-pool-size=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Jackson
spring.jackson.serialization.write-dates-as-timestamps=false

# Seguridad
mesaya.jwt.secret=${JWT_SECRET:}
mesaya.jwt.horas=${JWT_HORAS:8}
mesaya.cors.origins=${CORS_ORIGINS:http://localhost:4200}

# Datos de ejemplo (usuario demo, mesas, menú) si la base está vacía
mesaya.demo.datos=${DEMO_DATOS:true}

# Solo el health check queda expuesto
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.error.include-message=never
server.error.include-stacktrace=never
