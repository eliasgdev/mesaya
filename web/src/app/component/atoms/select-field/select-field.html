<div class="select-field">

  <label class="select-field__label">
    {{ label }}
  </label>

  <select
    class="select-field__select"
    [(ngModel)]="selected"
  >

    <option
      *ngFor="let option of options"
      [value]="option"
    >
      {{ option }}
    </option>

  </select>

</div>
