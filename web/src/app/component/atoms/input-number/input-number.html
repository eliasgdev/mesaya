<div class="input-number">
  @if (label()) {
    <label class="input-number__label" [for]="id">{{ label() }}</label>
  }
  <input
    class="input-number__input"
    type="number"
    inputmode="numeric"
    [id]="id"
    [placeholder]="placeholder()"
    [attr.min]="min()"
    [step]="step()"
    [required]="required()"
    [value]="value() ?? ''"
    (input)="actualizar($event)"
  >
</div>
