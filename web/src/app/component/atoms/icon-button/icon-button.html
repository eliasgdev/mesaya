<button
  type="button"
  [class]="'icon-button icon-button--' + type()"
  [attr.aria-label]="label()"
  [title]="label()"
  [disabled]="disabled()"
>
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"
       stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    @switch (icon()) {
      @case ('editar') { <path d="M12 20h9" /><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" /> }
      @case ('eliminar') { <path d="M3 6h18" /><path d="M8 6V4h8v2" /><path d="M19 6l-1 14H6L5 6" /> }
      @case ('buscar') { <circle cx="11" cy="11" r="7" /><path d="m20 20-3.5-3.5" /> }
      @case ('ver') { <path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /> }
      @case ('salir') { <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" /><path d="m16 17 5-5-5-5" /><path d="M21 12H9" /> }
      @case ('mas') { <path d="M12 5v14" /><path d="M5 12h14" /> }
      @case ('menos') { <path d="M5 12h14" /> }
    }
  </svg>
</button>
