<aside class="sidebar">
  <div class="sidebar__logo"><app-app-logo /></div>
  <nav class="sidebar__menu" aria-label="Menú principal">
    @for (e of enlaces; track e.ruta) {
      <a class="sidebar__link" [routerLink]="e.ruta" routerLinkActive="sidebar__link--activo" ariaCurrentWhenActive="page">{{ e.texto }}</a>
    }
  </nav>
</aside>
