<app-modal [title]="title()" (close)="cancelar.emit()">
  <p class="confirm-dialog__message">{{ message() }}</p>
  <app-error-message [message]="error()" />
  <div class="confirm-dialog__actions">
    <app-button text="Cancelar" type="ghost" (click)="cancelar.emit()" />
    <app-button [text]="confirmText()" type="danger" [loading]="loading()" (click)="confirmar.emit()" />
  </div>
</app-modal>
